# Render Blueprint — deploys the GridShift payments API.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: gridshift-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_URL
        sync: false # e.g. https://your-app.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: USD
      - key: CJ_EMAIL
        sync: false
      - key: CJ_API_KEY
        sync: false
      - key: CJ_DEFAULT_MARKUP
        value: "2.4"
